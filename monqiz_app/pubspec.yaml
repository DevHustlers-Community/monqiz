name: monqiz_app
description: "Monqiz - Emergency Blood Donation Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  font_awesome_flutter: ^11.0.0
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.6
  get_it: ^8.0.2

  # Routing
  go_router: ^14.6.2

  # Networking & Utilities
  dio: ^5.7.0
  intl: ^0.20.3
  equatable: ^2.0.7
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/animations/
